<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta property="og:title" content="Dilxz Official">

<title>About Dilxz Official</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">

<!-- ============================= -->
<!--            CSS                -->
<!-- ============================= -->
<style>
  * { margin:0; padding:0; box-sizing:border-box; }

  :root {
    --orange: #FF7A1A;
    --yellow: #F5D915;
    --green:  #8FE035;
    --blue:   #3FD1E8;
    --red:    #FF4D4D;
    --ink:    #111111;
    --bg:     #FBF3E7;

    --space-1: 8px;
    --space-2: 16px;
    --space-3: 24px;
    --space-4: 32px;
  }

  html { -webkit-text-size-adjust: 100%; }

  body {
    min-height: 100vh;
    font-family: 'Poppins', 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    background-image: radial-gradient(circle, rgba(17,17,17,0.05) 1.4px, transparent 1.4px);
    background-size: 20px 20px;
    display: flex;
    justify-content: center;
    padding: var(--space-4) var(--space-2) 60px;
  }

  .page {
    width: 100%;
    max-width: 400px;
    animation: rise .45s ease both;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ---------- Header ---------- */
  .header {
    background: var(--green);
    border: 3px solid var(--ink);
    border-radius: 14px;
    box-shadow: 6px 6px 0 var(--ink);
    padding: 14px var(--space-2);
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: var(--space-3);
  }

  .header .brand {
    background: #fff;
    border: 3px solid var(--ink);
    border-radius: 8px;
    padding: 8px var(--space-2);
    font-weight: 800;
    font-size: 15px;
    color: var(--ink);
    white-space: nowrap;
  }

  .header .icons { display:flex; gap: var(--space-1); flex-shrink: 0; }
  .header .icons span {
    width: 24px; height: 24px;
    border: 3px solid var(--ink);
    border-radius: 5px;
    background: #fff;
  }

  /* ---------- Window / kartu utama ---------- */
  .window {
    background: #fff;
    border: 3px solid var(--ink);
    border-radius: 16px;
    box-shadow: 8px 8px 0 var(--ink);
    overflow: hidden;
  }

  .window-bar {
    background: #E4E4E4;
    border-bottom: 3px solid var(--ink);
    padding: 12px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--space-2);
  }

  .window-bar .url {
    font-weight: 700;
    font-size: 13.5px;
    color: #2c2c2c;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .window-bar .lights { display:flex; gap: var(--space-1); flex-shrink: 0; }
  .window-bar .lights span {
    width: 20px; height: 20px;
    border: 3px solid var(--ink);
    border-radius: 5px;
  }
  .light-yellow { background: var(--yellow); }
  .light-green  { background: var(--green); }
  .light-red    { background: var(--red); }

  .window-body { padding: var(--space-3); }

  /* ---------- Foto + tombol sosial ---------- */
  .photo-frame {
    background: var(--orange);
    border: 3px solid var(--ink);
    border-radius: 14px;
    box-shadow: 6px 6px 0 var(--ink);
    padding: 14px;
    margin-bottom: var(--space-4);
  }

  .photo-box {
    position: relative;
    border: 3px solid var(--ink);
    border-radius: 8px;
    aspect-ratio: 1 / 1;
    overflow: hidden;
    background: #ddd;
  }

  .photo-box img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .photo-box .fallback-avatar {
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    font-size: 60px; font-weight: 900; color:#fff;
    background: repeating-linear-gradient(45deg, var(--red), var(--red) 14px, #ff7d7d 14px, #ff7d7d 28px);
  }

  .social-row {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-top: var(--space-2);
  }

  .social-btn {
    width: 48px; height: 48px;
    display: flex; align-items:center; justify-content:center;
    background: var(--blue);
    border: 3px solid var(--ink);
    border-radius: 10px;
    box-shadow: 3px 3px 0 var(--ink);
    color: var(--ink);
    font-size: 20px;
    text-decoration: none;
    transition: transform .12s ease, box-shadow .12s ease;
  }

  .social-btn:hover  { transform: translate(-2px,-2px); box-shadow: 5px 5px 0 var(--ink); }
  .social-btn:active,
  .social-btn:focus-visible { transform: translate(1px,1px); box-shadow: 1px 1px 0 var(--ink); }
  .social-btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  /* ---------- Teks ---------- */
  .greet {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: #767676;
    margin-bottom: 6px;
  }

  .name-line {
    font-size: 30px;
    font-weight: 800;
    color: var(--ink);
    text-transform: uppercase;
    line-height: 1.15;
    word-break: break-word;
  }

  .name-line .name {
    text-decoration: underline;
    text-decoration-thickness: 3px;
    text-underline-offset: 5px;
    text-decoration-color: var(--orange);
  }

  .bio-row {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    margin-top: var(--space-2);
  }

  .bio-row .bar {
    width: 5px;
    height: 20px;
    background: var(--ink);
    border-radius: 3px;
    flex-shrink: 0;
    margin-top: 2px;
  }

  .bio-row span.text {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.3px;
    line-height: 1.5;
    color: #2c2c2c;
  }

  /* ---------- Tombol donasi ---------- */
  .actions {
    margin-top: var(--space-4);
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .donate-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 17px;
    border: 3px solid var(--ink);
    border-radius: 12px;
    font-weight: 800;
    font-size: 16px;
    letter-spacing: 0.4px;
    text-transform: uppercase;
    text-decoration: none;
    color: var(--ink);
    box-shadow: 5px 5px 0 var(--ink);
    transition: transform .12s ease, box-shadow .12s ease;
  }

  .donate-btn:hover  { transform: translate(-2px,-2px); box-shadow: 7px 7px 0 var(--ink); }
  .donate-btn:active,
  .donate-btn:focus-visible { transform: translate(2px,2px); box-shadow: 2px 2px 0 var(--ink); }
  .donate-btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }

  .btn-green { background: var(--green); }
  .btn-red   { background: var(--red); color: #fff; }

  footer {
    text-align: center;
    margin-top: var(--space-3);
    font-size: 12px;
    font-weight: 600;
    color: #8a8a8a;
  }

  footer .heart { color: var(--red); }

  /* ---------- Responsif layar sangat kecil (<360px) ---------- */
  @media (max-width: 360px) {
    body { padding: var(--space-3) 12px 40px; }
    .window-body { padding: var(--space-2); }
    .name-line { font-size: 25px; }
    .header .brand { font-size: 13.5px; padding: 7px 12px; }
    .donate-btn { font-size: 14.5px; padding: 15px; }
    .social-btn { width: 44px; height: 44px; font-size: 18px; }
  }

  /* ---------- Hormati preferensi reduce motion ---------- */
  @media (prefers-reduced-motion: reduce) {
    .social-btn, .donate-btn, .page { transition: none; animation: none; }
  }
</style>
</head>
<body>

<!-- ============================= -->
<!--            HTML               -->
<!-- ============================= -->
<div class="page">

  <header class="header">
    <div class="brand">Dilxz Official</div>
    <div class="icons" aria-hidden="true"><span></span><span></span></div>
  </header>

  <main class="window">
    <div class="window-bar">
      <span class="url">aboutdilxz.vercel.app</span>
      <div class="lights" aria-hidden="true">
        <span class="light-yellow"></span>
        <span class="light-green"></span>
        <span class="light-red"></span>
      </div>
    </div>

    <div class="window-body">

      <div class="photo-frame">
        <div class="photo-box" id="avatarBox">
          <img
            id="avatarImg"
            src="https://github.com/dilxzcode.png"
            alt="Foto profil Dilxz Official"
            loading="lazy">
        </div>

        <nav class="social-row" aria-label="Tautan media sosial">
          <a href="https://youtube.com/@dilxztech" target="_blank" rel="noopener noreferrer" class="social-btn" title="YouTube" aria-label="YouTube">
            <i class="fa-brands fa-youtube" aria-hidden="true"></i>
          </a>
          <a href="https://www.instagram.com/dilxzhere" target="_blank" rel="noopener noreferrer" class="social-btn" title="Instagram" aria-label="Instagram">
            <i class="fa-brands fa-instagram" aria-hidden="true"></i>
          </a>
          <a href="https://tiktok.com/@dilxzmodz" target="_blank" rel="noopener noreferrer" class="social-btn" title="TikTok" aria-label="TikTok">
            <i class="fa-brands fa-tiktok" aria-hidden="true"></i>
          </a>
        </nav>
      </div>

      <p class="greet">Hi there, i'am creator</p>
      <h1 class="name-line"><span class="name">Dilxz Official</span></h1>

      <div class="bio-row">
        <span class="bar" aria-hidden="true"></span>
        <span class="text">Open source &amp; backend dev</span>
      </div>

      <div class="actions">
        <a href="https://whatsapp.com/channel/0029VanRJcU7NoaADR1oyb2v" target="_blank" rel="noopener noreferrer" class="donate-btn btn-green">
          <i class="fa-brands fa-whatsapp" aria-hidden="true"></i> WhatsApp Channel
        </a>
        <a href="https://files.catbox.moe/pg4ot3.jpg" target="_blank" rel="noopener noreferrer" class="donate-btn btn-red">
          <i class="fa-solid fa-qrcode" aria-hidden="true"></i> QRIS All Payments
        </a>
      </div>

    </div>
  </main>

  <footer>&copy; 2026 Dilxz Official &bull; crafted with <span class="heart">&hearts;</span></footer>
</div>

<!-- ============================= -->
<!--             JS                -->
<!-- ============================= -->
<script>
  // Kalau foto gagal dimuat (link mati/expired), tampilkan huruf inisial
  // sebagai pengganti supaya tidak muncul ikon gambar rusak.
  document.getElementById('avatarImg').addEventListener('error', function () {
    var box = document.getElementById('avatarBox');
    box.innerHTML = '<div class="fallback-avatar">D</div>';
  }, { once: true });
</script>

</body>
</html>
